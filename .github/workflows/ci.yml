name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lineos
          POSTGRES_PASSWORD: lineos
          POSTGRES_DB: flows_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lineos -d flows_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql+psycopg://lineos:lineos@127.0.0.1:5432/flows_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            ops/requirements.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest -q
        working-directory: backend
      - name: MCP self-test (offline half)
        run: python backend/mcp/selftest.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Stage 0 acceptance, as far as a runner can take it: a clean machine,
  # `docker compose up`, and the app answering through its own nginx.
  compose:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 180
      - name: The SPA and the API answer through the frontend
        run: |
          curl -fsS http://127.0.0.1:8020/healthz
          curl -fsS http://127.0.0.1:8020/ | grep -q '<title>lineOS</title>'
          curl -fsS http://127.0.0.1:8020/api/health
          curl -fsS http://127.0.0.1:8020/api/auth/me | grep -q '"registration":"first_run"'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
