# lineOS: Postgres + API + the published frontend.
#
#   cp .env.example .env    # set FLOW_DB_PASSWORD
#   docker compose up -d    # then open http://localhost:8020 and create the admin
#
# In development the frontend runs on Vite instead (`npm run dev`, port 5173)
# and reaches the API through the /api proxy in vite.config.js, which is why
# the API is also published on 127.0.0.1:8010. See docs/DEPLOY.md.
#
# The dataset tabs of the Data Lineage module read a Postgres of yours; that is
# opt-in, in docker-compose.lineage.yml, so this file starts on a machine that
# has nothing else running.

name: lineos

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lineos
      POSTGRES_DB: lineos
      POSTGRES_PASSWORD: ${FLOW_DB_PASSWORD:?set FLOW_DB_PASSWORD in .env}
    # Tuned to the memory ceiling below: shared_buffers plus max_connections x
    # work_mem has to fit in it. Raise one, raise the other (docs/BACKEND.md).
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=50
      - -c
      - work_mem=4MB
      - -c
      - max_parallel_workers_per_gather=0
    # Loopback only. The collector (ops/collector) runs on the host, from cron,
    # and writes its telemetry here through a restricted role -- see
    # ops/README.md. Nothing else needs this port.
    ports:
      - "127.0.0.1:${FLOW_DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lineos -d lineos"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - lineos
    deploy:
      resources:
        limits:
          cpus: "0.60"
          memory: 512M
        reservations:
          memory: 256M

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://lineos:${FLOW_DB_PASSWORD}@postgres:5432/lineos
      DB_SCHEMA: flow
      STORAGE_DIR: /data/files
      # Label written to flow_versions.author when a save arrives through a
      # share link; with an account, the user's name wins.
      AUTHOR: ${FLOW_AUTHOR:-}
      MAX_UPLOAD_MB: ${FLOW_MAX_UPLOAD_MB:-10}
      # Accounts and sharing. PUBLIC_BASE_URL is the address that goes into the
      # body of an email; SESSION_COOKIE_SECURE can only be true under HTTPS.
      REGISTRATION: ${FLOW_REGISTRATION:-invite}
      PUBLIC_BASE_URL: ${FLOW_PUBLIC_BASE_URL:-http://localhost:8020/}
      SESSION_COOKIE_SECURE: ${FLOW_SESSION_COOKIE_SECURE:-false}
      SESSION_DAYS: ${FLOW_SESSION_DAYS:-30}
      # SMTP is optional: with no host, "Send by email" falls back to the
      # visitor's own mail client (mailto:) instead of failing.
      SMTP_HOST: ${FLOW_SMTP_HOST:-}
      SMTP_PORT: ${FLOW_SMTP_PORT:-587}
      SMTP_USER: ${FLOW_SMTP_USER:-}
      SMTP_PASSWORD: ${FLOW_SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${FLOW_SMTP_STARTTLS:-true}
      SMTP_FROM: ${FLOW_SMTP_FROM:-}
    ports:
      - "127.0.0.1:${FLOW_API_PORT:-8010}:8000"
    volumes:
      - files:/data/files
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - lineos
    deploy:
      resources:
        limits:
          cpus: "0.60"
          memory: 384M
        reservations:
          memory: 128M

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        # The subpath the SPA is served from: "/" at the root of a host, or
        # e.g. "/lineos/" behind a proxy that shares the host. Fixed at build
        # time -- Vite rewrites the asset URLs.
        LINEOS_BASE: ${FLOW_BASE:-/}
    restart: unless-stopped
    # Loopback by default: put a reverse proxy with HTTPS in front, or set
    # FLOW_BIND_IP to a private interface.
    ports:
      - "${FLOW_BIND_IP:-127.0.0.1}:${FLOW_HTTP_PORT:-8020}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - lineos
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 128M

volumes:
  pgdata:
  files:

networks:
  lineos:
