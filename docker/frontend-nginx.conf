# The frontend container's nginx. Serves the SPA at /flow-editor/ and forwards
# /flow-editor/api/ to the API container. The nginx-proxy-manager passes the
# path through untouched (see docs/DEPLOY.md).
server {
  listen 80;
  server_name _;
  # Relative redirects: with absolute_redirect on, nginx builds http://$host/...
  # and loses both the published port (8020) and the proxy's scheme.
  absolute_redirect off;
  # Docker DNS: the variable in proxy_pass forces re-resolution when the API
  # container restarts on a new IP.
  resolver 127.0.0.11 valid=10s;

  # API -> FastAPI. The /flow-editor prefix is stripped; the API exposes /api/*.
  location /flow-editor/api/ {
    # The compose SERVICE name, not the container_name. Compose gives both a
    # network alias, but container_name is per-stack: pinning to `flow-api`
    # couples this file to one deployment, and a second stack of the same
    # project answers 502 on every API call. `api` resolves in either.
    set $api_upstream http://api:8000;
    rewrite ^/flow-editor(/api/.*)$ $1 break;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Room for the API's 10 MB per-attachment ceiling.
    client_max_body_size 12m;
    proxy_read_timeout 120s;
  }

  # Hashed bundles: immutable cache.
  location ~* ^/flow-editor/assets/ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA: every route falls through to index.html.
  location /flow-editor/ {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /flow-editor/index.html;
    add_header Cache-Control "no-cache" always;
  }

  location = /flow-editor { return 301 /flow-editor/; }

  # The old published subpath. A share link that went out as
  # /editor-fluxo/#/share/<token> keeps working: the browser reattaches the
  # fragment to the redirect target.
  location /editor-fluxo/ { return 301 /flow-editor/; }
  location = /editor-fluxo { return 301 /flow-editor/; }

  location = / { return 302 /flow-editor/; }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }
}
